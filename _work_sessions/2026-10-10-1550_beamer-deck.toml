notes = """Gotchas found and fixed this session:
- Footer checker reference page must be an empty-bottom slide (a part opener). Deleting a slide shifted
  page 4 from opener to content and produced 27 false flags until the reference was moved to page 3.
- pdftotext interleaves the letter-spaced section kicker with the title ("§M12ods"), so text-based page
  lookup by kicker fails; find slides by title text instead.
- fontspec TeX ligatures turn ' and \" into curly quotes and -- into an en dash in sans text. \\defaultfontfeatures{} and Ligatures=ResetAll do NOT stop it under XeTeX; \\defaultfontfeatures[\\rmfamily,\\sffamily]{} does (tested on a 1-page doc before writing the deck).
- A tcblisting environment with an optional argument whose first code line starts with '{' swallows the brace during the optional-arg lookahead and never finds \\end{code}. Fix: pass an explicit [] .
- Beamer loads amsmath, so \\newcommand{\\tag} clashes - renamed to \\badge.
- sed with backslash-heavy LaTeX patterns silently matched nothing twice in Git Bash; used the Edit tool instead.
- First footer checker had false positives (content reaching the bottom-left was mistaken for the footer); fixed by measuring the footer rows once on a part-opener reference page."""
