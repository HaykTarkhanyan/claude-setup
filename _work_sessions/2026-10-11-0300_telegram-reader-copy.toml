notes = """The session file was deliberately NOT copied. A copy would mean two files holding the same auth key, and
Telegram can revoke a session used from two places at once (00_notes already has a telegram_reader.session.dead-20260825).
Pointing at the one original file means SQLite locking keeps it to one process at a time, and a second one fails loudly
with 'database is locked'. Alternative if the demo should be independent of 00_notes: run --auth here for a fresh,
separately revocable session, and drop TELEGRAM_SESSION_PATH from .mcp.json.
00_notes/telegram/fetch_chats.py (standalone fallback script) was not copied."""
